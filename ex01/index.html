<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Positioning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <h2>Navigation Bar</h2>
  </nav>

  <div class="card">
    <span class="badge">NEW</span>
    <h3>My Card</h3>
    <p>Because the card uses <code>position: relative</code>, the badge's top and right values are measured from this card's boundaries, not the body element.</p>
  </div>

  <a href="#" class="back-to-top">↑ Top</a>

</body>
</html>
