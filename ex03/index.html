<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03: Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="named-box">
        Named Color (Red)
    </div>
    <br>

    <div class="hex-box">
        HEX Color (#00FF00)
    </div>
    <br>

    <div class="rgb-box">
        RGB Color (0, 0, 255)
    </div>
    <br>

    <div class="rgba-box">
        RGBA Color (Alpha 0.5)
    </div>
    <br><br>

    <div class="opacity-box">
        Background with Opacity 0.5
        <div>This text is faded! (النص كمان صار شفاف)</div>
    </div>
    <br>

    <div class="rgba-compare-box">
        Background with RGBA(..., 0.5)
        <div>This text is clear! (النص واضح ومش شفاف)</div>
    </div>
</body>

</html>
